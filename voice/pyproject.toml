[project]
name = "titan-voice"
version = "0.1.0"
description = "Titan Lane 4: SIP bridge probe and metadata-only call forwarding"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.2",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "python-dotenv==1.2.4",
  "twilio==9.13.0",
  "uvicorn[standard]==0.54.0",
  "pipecat-ai[nvidia,elevenlabs,websocket,livekit]==1.15.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
